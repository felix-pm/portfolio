<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideTeam - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* --- FOND ANIMÉ (EFFET VITESSE) --- */
        .speed-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(10, 10, 10, 0.9), rgba(10, 10, 10, 0.9)),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); 
            z-index: -1;
        }

        .road-line {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: speed 2s infinite linear;
        }

        .road-line:nth-child(2) { top: 30%; animation-delay: 0.5s; opacity: 0.5; }
        .road-line:nth-child(3) { top: 70%; animation-delay: 1s; opacity: 0.3; }

        @keyframes speed {
            0% { transform: translate(-50%, -50%) rotate(-45deg) translateX(-100%); }
            100% { transform: translate(-50%, -50%) rotate(-45deg) translateX(100%); }
        }

        /* --- CONTENEUR PRINCIPAL --- */
        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 600px;
        }

        /* --- LE LOGO --- */
        .logo-wrapper {
            margin-bottom: 2rem;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(228, 58, 54, 0.3));
        }

        .logo-wrapper img {
            max-width: 350px;
            width: 100%;
            height: auto;
        }

        /* --- TYPOGRAPHIE --- */
        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #b3b3b3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            color: #E63946; /* Rouge du logo */
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .status::after {
            content: '';
            display: block;
            width: 100%;
            height: 3px;
            background: #E63946;
            margin-top: 5px;
            box-shadow: 0 0 10px #E63946;
            animation: loading 2s infinite ease-in-out;
        }

        p.subtitle {
            color: #a0a0a0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* --- BOUTON CTA --- */
        .btn {
            text-decoration: none;
            color: white;
            padding: 15px 40px;
            border: 2px solid #E63946;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            background: rgba(230, 57, 70, 0.1);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn:hover {
            background: #E63946;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
            transform: translateY(-3px);
        }

        /* --- ANIMATIONS --- */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes loading {
            0% { width: 0%; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0%; margin-left: 100%; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .logo-wrapper img { max-width: 250px; }
        }
    </style>
</head>
<body>

    <div class="speed-lines">
        <div class="road-line"></div>
        <div class="road-line"></div>
        <div class="road-line"></div>
    </div>

    <div class="container">
        <div class="logo-wrapper">
            <img src="./assets/img/favicon.png" alt="RideTeam Logo">
        </div>

        <div class="status">Site en développement</div>
        <h1>Moteurs en chauffe...</h1>
        
        <p class="subtitle">
            On prépare la piste pour la meilleure expérience moto entre amis.<br>
            Le nouveau site <strong>RideTeam</strong> arrive très bientôt.
        </p>

        <a href="mailto:contact@rideteam.fr" class="btn">Nous Contacter</a>
    </div>

</body>
</html>

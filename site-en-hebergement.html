<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The League - En cours d'hébergement</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- RESET & BASE --- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0a0a0a;
        color: #ffffff;
        font-family: "Montserrat", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* --- FOND ANIMÉ (EFFET VITESSE / E-SPORT) --- */
      .speed-lines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          linear-gradient(rgba(10, 5, 30, 0.9), rgba(10, 5, 30, 0.9)),
          url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
        z-index: -1;
      }

      .road-line {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-45deg);
        width: 200%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(100, 50, 255, 0.3),
          transparent
        ); /* Violet/Bleu */
        animation: speed 2s infinite linear;
      }

      .road-line:nth-child(2) {
        top: 30%;
        animation-delay: 0.5s;
        opacity: 0.5;
      }
      .road-line:nth-child(3) {
        top: 70%;
        animation-delay: 1s;
        opacity: 0.3;
      }

      @keyframes speed {
        0% {
          transform: translate(-50%, -50%) rotate(-45deg) translateX(-100%);
        }
        100% {
          transform: translate(-50%, -50%) rotate(-45deg) translateX(100%);
        }
      }

      /* --- CONTENEUR PRINCIPAL --- */
      .container {
        text-align: center;
        z-index: 10;
        padding: 20px;
        max-width: 600px;
      }

      /* --- LE LOGO --- */
      .logo-wrapper {
        margin-top: -4rem;
        margin-bottom: 2rem;
        animation: float 6s ease-in-out infinite;
        filter: drop-shadow(
          0 0 30px rgba(100, 50, 255, 0.6)
        ); /* Violet/Bleu glow */
      }

      .logo-wrapper img {
        max-width: 400px; /* Un peu plus grand */
        width: 100%;
        height: auto;
      }

      /* --- TYPOGRAPHIE --- */
      h1 {
        font-family: "Russo One", sans-serif;
        font-size: 2.8rem; /* Un peu plus grand */
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
        background: linear-gradient(
          90deg,
          #ffffff,
          #8e2de2
        ); /* Blanc vers Violet */
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 15px rgba(142, 45, 226, 0.5);
      }

      .status {
        color: #8e2de2; /* Violet du logo */
        font-weight: 700;
        font-size: 1.3rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 20px;
        position: relative;
        display: inline-block;
        text-shadow: 0 0 10px rgba(142, 45, 226, 0.8);
      }

      .status::after {
        content: "";
        display: block;
        width: 100%;
        height: 4px;
        background: linear-gradient(
          90deg,
          #4a00e0,
          #8e2de2
        ); /* Dégradé Violet/Bleu */
        margin-top: 5px;
        box-shadow: 0 0 15px #8e2de2;
        animation: loading 2s infinite ease-in-out;
      }

      p.subtitle {
        color: #cccccc;
        margin-bottom: 40px;
        line-height: 1.6;
        font-size: 1.1rem;
      }

      /* --- BOUTON CTA --- */
      .btn {
        text-decoration: none;
        color: white;
        padding: 15px 45px;
        border: 2px solid #8e2de2;
        font-weight: bold;
        text-transform: uppercase;
        transition: 0.3s;
        background: rgba(142, 45, 226, 0.15);
        letter-spacing: 2px;
        position: relative;
        overflow: hidden;
        display: inline-block;
        cursor: pointer;
        border-radius: 5px;
      }

      .btn:hover {
        background: linear-gradient(
          90deg,
          #4a00e0,
          #8e2de2
        ); /* Dégradé Violet/Bleu */
        box-shadow: 0 0 25px rgba(142, 45, 226, 0.8);
        transform: translateY(-3px);
        border-color: transparent;
      }

      /* --- ANIMATIONS --- */
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-15px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      @keyframes loading {
        0% {
          width: 0%;
          margin-left: 0;
        }
        50% {
          width: 100%;
          margin-left: 0;
        }
        100% {
          width: 0%;
          margin-left: 100%;
        }
      }

      /* --- RESPONSIVE --- */
      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }
        .logo-wrapper img {
          max-width: 280px;
        }
        .status {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="speed-lines">
      <div class="road-line"></div>
      <div class="road-line"></div>
      <div class="road-line"></div>
    </div>

    <div class="container">
      <div class="logo-wrapper">
        <img
          src="./assets/img/the-league-img-removebg.png"
          alt="The League Logo"
        />
      </div>

      <div class="status">Configuration du serveur</div>
      <h1>Transfert vers les serveurs</h1>

      <p class="subtitle">
        Je finalise l'installation sur les serveurs.<br />
        La propagation est en cours, <strong>The League</strong> sera accessible
        dans quelques instants.
      </p>
    </div>
  </body>
</html>
